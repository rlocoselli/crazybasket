import java.util.regex.Pattern

// Keystore and passwords remain private, outside Android source/assets.
def signingPropertiesFile = rootProject.file('../signing/release.properties')
def releaseSigning = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { releaseSigning.load(it) }
}


android {
    namespace 'com.madtriangle.basketshots'
    compileSdkVersion 33
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ["$buildDir/generated/jniLibs"]
        }

    }
    signingConfigs {
        if (!releaseSigning.isEmpty()) {
            release {
                storeFile new File(signingPropertiesFile.parentFile, releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (!releaseSigning.isEmpty()) signingConfig signingConfigs.release
        }
    }
    defaultConfig {
        applicationId = doExtractStringFromManifest("package")
        minSdkVersion 14
        targetSdkVersion 33
        multiDexEnabled true
        versionCode 3
        versionName "1.2.0"
    }
}
def doExtractStringFromManifest(name) {
    def manifestFile = file(android.sourceSets.main.manifest.srcFile)
    def pattern = Pattern.compile(name + "=\"(\\S+)\"")
    def matcher = pattern.matcher(manifestFile.getText())
    matcher.find()
    return matcher.group(1)
}
