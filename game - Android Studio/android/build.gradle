// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives {
    inputs.files(configurations.natives)
    outputs.dir(file("$buildDir/generated/jniLibs"))
    doLast {
        configurations.natives.files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].find {
                jar.name.endsWith("natives-${it}.jar")
            }
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("$buildDir/generated/jniLibs/$abi")
                    include '*.so'
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn copyAndroidNatives }

task run(type: Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty('sdk.dir')
        if (sdkDir) {
            path = sdkDir
        } else {
            path = "$System.env.ANDROID_HOME"
        }
    } else {
        path = "$System.env.ANDROID_HOME"
    }

    def adb = path + "/platform-tools/adb"
    commandLine "$adb", 'shell', 'am', 'start', '-n', 'com.madtriangle.basketshots/com.madtriangle.basketshots.AndroidLauncher'
}

dependencies {
        implementation "com.google.android.gms:play-services-ads:9.0.0"
        implementation "androidx.multidex:multidex:2.0.1"
}
